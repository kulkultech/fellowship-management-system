services:
  postgres:
    image: postgres:16-alpine
    container_name: fms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-fms_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fms_user} -d ${POSTGRES_DB:-fms_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fms_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-fms_dev_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-fms_dev_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
