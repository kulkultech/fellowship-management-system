name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ── 1. Quality & Test Matrix ──────────────────────────
  verify:
    name: Lint & Test Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/backend/go.sum

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package.json'

      - name: Verify Backend (Vet & Test)
        run: |
          cd apps/backend
          go vet ./...
          go test -v ./...
          go build -v -o /dev/null ./cmd/api

      - name: Verify Frontend (Typecheck & Build)
        run: |
          cd apps/frontend
          npm install
          npx tsc -b
          npm run build

  # ── 2. Build & Push Docker Images ─────────────────────
  build-and-push:
    name: Build & Push Docker Images
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute Image Prefix (Lowercase)
        id: img
        run: echo "prefix=${REGISTRY}/${IMAGE_PREFIX,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.prefix }}-backend:${{ github.sha }}
            ${{ steps.img.outputs.prefix }}-backend:latest

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
          tags: |
            ${{ steps.img.outputs.prefix }}-frontend:${{ github.sha }}
            ${{ steps.img.outputs.prefix }}-frontend:latest

  # ── 3. Automated Server Deployment ───────────────────
  deploy:
    name: Deploy to Kulkul Server / Cloud Run
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy Notification / Trigger
        run: |
          echo "🚀 Deployment triggered for commit ${{ github.sha }}"
          echo "Backend Image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}"
          echo "Frontend Image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}"
          # In production with GCP Service Account / Secret Manager:
          # gcloud run deploy backend --image=${{ steps.img.outputs.prefix }}-backend:${{ github.sha }} ...
